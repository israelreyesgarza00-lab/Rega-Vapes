<!--
Principales condiciones

Ancho y alto del viewport:
max-width: Aplica estilos si el ancho de la pantalla es menor o igual al valor especificado.
min-width: Aplica estilos si el ancho de la pantalla es mayor o igual al valor especificado.

Orientación del dispositivo:
orientation: portrait: Para dispositivos en modo vertical.
orientation: landscape: Para dispositivos en modo horizontal.

Resolución de pantalla:
min-resolution: Aplica estilos según la densidad de píxeles (dpi).
max-resolution: Similar, pero limita hacia abajo.

Tipo de dispositivo:
screen: Pantallas de computadoras, tabletas, móviles, etc.
print: Para estilos de impresión.

Combinaciones:
and
not
only
, (or)
-->
