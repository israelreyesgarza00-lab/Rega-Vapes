
<html>
<head>
<title>Flex Direction</title> <meta charset="utf-8">
<link rel="stylesheet" type="text/css" href="flex-direction.css">
</head>
<body>
    <h2>Es el valor por defecto.<br>Fila (horizontal).<br>flex-direction: row;<br></h2>
    <div id="contenedor-row">
      <div class="caja">1</div>
      <div class="caja">2</div>
      <div class="caja">3</div>
      <div class="caja">4</div>
    </div>
    
    <h2>Fila invertida (horizontal).<br>flex-direction: row-reverse;</h2>
    <div id="contenedor-row-reverse">
      <div class="caja">1</div>
      <div class="caja">2</div>
      <div class="caja">3</div>
      <div class="caja">4</div>
    </div>
    
    <h2>Columna (vertical).<br>flex-direction: column;</h2>
    <div id="contenedor-column">
      <div class="caja">1</div>
      <div class="caja">2</div>
      <div class="caja">3</div>
      <div class="caja">4</div>
    </div>
    
    <h2> Columna invertida(vertical).<br>flex-direction: column-reverse;</h2>
    <div id="contenedor-column-reverse">
      <div class="caja">1</div>
      <div class="caja">2</div>
      <div class="caja">3</div>
      <div class="caja">4</div>
    </div>
</body>
</html>
