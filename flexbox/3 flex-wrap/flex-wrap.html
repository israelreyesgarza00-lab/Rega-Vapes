
<html>
<head>
<title>flex-wrap</title> <meta charset="utf-8">
<link rel="stylesheet" type="text/css" href="flex-wrap.css">
</head>
<body>
   <h2>Es el valor por defecto.<br>Todo en una fila/columna.<br>flex-wrap: no-wrap; </h2>
    <div id="flex-no-wrap">
      <div class="caja">1</div>
      <div class="caja">2</div>
      <div class="caja">3</div>
      <div class="caja">4</div>
      <div class="caja">5</div>
    </div>
   <h2>Los elementos saltan a la siguiente línea.<br>flex-wrap: wrap;</h2>
    <div id="flex-wrap">
      <div class="caja">Uno</div>
      <div class="caja">Dos</div>
      <div class="caja">Tres</div>
      <div class="caja">Cuatro</div>
      <div class="caja">Cinco</div>
    </div>
   <h2>Los elementos saltan a la línea anterior.<br>flex-wrap: wrap-reverse;</h2>
    <div id="flex-wrap-reverse">
      <div class="caja">A</div>
      <div class="caja">B</div>
      <div class="caja">C</div>
      <div class="caja">D</div>
      <div class="caja">E</div>
    </div>
</body>
</html>
